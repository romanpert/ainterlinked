<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ainterlinked switchboard</title>
<style>
/* Layout: switchboard — agents (presence) | task board | live feed & mail. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --line: #dfe3ea; --fg: #17202e; --muted: #5d6879;
  --accent: #2a5bd7; --accent-soft: #e6edfc;
  --ok: #1f8a57; --warn: #b7791f; --bad: #c2413a; --idle: #7a8596;
  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --panel: #161d28; --line: #263142; --fg: #e4e9f1; --muted: #93a0b3;
  --accent: #7ea2ff; --accent-soft: #1d2a45; --ok: #4cc38a; --warn: #e0a84a; --bad: #f07a72; --idle: #7d8899;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141c; --panel: #161d28; --line: #263142; --fg: #e4e9f1; --muted: #93a0b3;
  --accent: #7ea2ff; --accent-soft: #1d2a45; --ok: #4cc38a; --warn: #e0a84a; --bad: #f07a72; --idle: #7d8899;
  color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui); }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0; font-size: 17px; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.meta b { color: var(--fg); font-weight: 600; }
main { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.6fr) minmax(280px, 1.1fr); gap: 16px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 1100px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } #mail { grid-column: 1 / -1; } }
@media (max-width: 700px) { main { grid-template-columns: minmax(0, 1fr); } }
section { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
h2 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600;
  display: flex; justify-content: space-between; }
.list { display: flex; flex-direction: column; gap: 8px; }
.agent { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.agent .top { display: flex; gap: 8px; align-items: center; min-width: 0; }
.agent .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
.s-working .dot { background: var(--ok); } .s-waiting .dot { background: var(--accent); }
.s-blocked .dot { background: var(--bad); } .s-offline { opacity: .55; }
.agent .top { flex-wrap: wrap; }
.act { overflow-wrap: anywhere; word-break: break-word; }
.chip { font: 11px var(--font-mono); padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.tier-push { color: var(--ok); } .chip.tier-pull { color: var(--muted); }
.sub { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.act { font: 12px var(--font-mono); color: var(--fg); overflow-wrap: anywhere; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 1400px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.col { background: color-mix(in srgb, var(--panel) 60%, var(--bg)); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.col h3 { margin: 0 0 2px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.task { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
.task.p0 { border-left-color: var(--bad); } .task.p1 { border-left-color: var(--warn); }
.task .tid { font: 11px var(--font-mono); color: var(--muted); }
.task .who { font-size: 11.5px; color: var(--accent); }
.feed, .msgs { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 38vh; overflow: auto; }
.ev { display: grid; grid-template-columns: 62px 64px 1fr; gap: 8px; font-size: 12.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.ev:last-child { border-bottom: 0; }
.ev time, .ev .k { font: 11.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .s { min-width: 0; overflow-wrap: anywhere; }
.msg { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.msg:last-child { border-bottom: 0; }
.msg .h { font-size: 12px; color: var(--muted); }
.msg .h b { color: var(--fg); }
.msg pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.45 var(--font-ui); }
form { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
input, textarea, button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { grid-column: 1 / -1; min-height: 56px; resize: vertical; }
button { background: var(--accent); color: var(--panel); border-color: var(--accent); cursor: pointer; font-weight: 600; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
.err { color: var(--bad); font-size: 12.5px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <h1>ainter<span>linked</span></h1>
  <div class="meta" id="meta">connecting…</div>
</header>
<main>
  <section id="agents-col">
    <h2>Agents <span id="agents-n"></span></h2>
    <div class="list" id="agents"><div class="empty">No agents yet. Start a session in any wired harness.</div></div>
    <h2>Harnesses on this machine</h2>
    <div class="list" id="harnesses"></div>
  </section>
  <section>
    <h2>Board <span><select id="board-pick" aria-label="Board"></select></span></h2>
    <div class="board" id="board"></div>
    <h2>Reservations</h2>
    <div class="list" id="locks"></div>
  </section>
  <section id="mail">
    <h2>Send as human</h2>
    <form id="send">
      <input id="to" placeholder="to: agent name, project:x, *" aria-label="Recipient" autocomplete="off">
      <button type="submit">Send</button>
      <textarea id="body" placeholder="Message for the agents" aria-label="Message"></textarea>
    </form>
    <div class="err" id="send-err"></div>
    <h2>Messages</h2>
    <div class="msgs" id="msgs"></div>
    <h2>Activity</h2>
    <div class="feed" id="feed"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ago = (ms) => { const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 172800 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d"; };
const hhmm = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
let board = "";
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
function renderAgents(list) {
  $("agents-n").textContent = list.filter((a) => a.online).length + " online";
  if (!list.length) return;
  $("agents").innerHTML = list.map((a) => {
    const st = a.online ? a.state : "offline";
    return `<div class="agent s-${esc(st)}"><div class="top"><span class="dot" title="${esc(st)}"></span><span class="name">${esc(a.name)}</span>
      <span class="chip">${esc(a.harness)}</span><span class="chip tier-${esc((a.delivery || "pull").split(",")[0])}">${esc(a.delivery || "pull")}</span></div>
      <div class="sub">${esc(st)}${a.project ? " · " + esc(a.project) : ""}${a.branch ? "@" + esc(a.branch) : ""} · seen ${ago(a.last_seen)}${a.unread ? " · " + a.unread + " unread" : ""}${a.role ? " · " + esc(a.role) : ""}</div>
      ${a.activity ? `<div class="act">${esc(a.activity)}</div>` : ""}</div>`;
  }).join("");
}
function renderHarnesses(list) {
  const seen = list.filter((h) => h.detected || h.mcp);
  if (!seen.length) { $("harnesses").innerHTML = `<div class="empty">Machine scan unavailable.</div>`; return; }
  $("harnesses").innerHTML = seen.map((h) => {
    let note, cls;
    if (!h.mcp) { note = `detected, not wired · <span class="act">ainterlinked install ${esc(h.id)}</span>`; cls = "s-blocked"; }
    else if (!h.enabled) { note = "muted · ainterlinked enable " + esc(h.id); cls = "s-offline"; }
    else if (h.has_hooks && !h.hooks) { note = `MCP only, hooks missing · <span class="act">ainterlinked install ${esc(h.id)}</span>`; cls = "s-waiting"; }
    else { note = "wired"; cls = "s-working"; }
    return `<div class="sub ${cls}" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="dot"></span><b style="color:var(--fg)">${esc(h.name)}</b>
      ${h.mcp ? `<span class="chip tier-${esc(h.tier)}">${esc(h.tier)}</span>` : ""}<span>${note}</span></div>`;
  }).join("");
}
function renderBoard(tasks, boards) {
  const names = boards.map((b) => b.name);
  if (!board || !names.includes(board)) board = names[0] || "";
  $("board-pick").innerHTML = names.map((n) => `<option ${n === board ? "selected" : ""}>${esc(n)}</option>`).join("");
  const cols = [["todo", "To do"], ["doing", "Doing"], ["blocked", "Blocked"], ["done", "Done"]];
  const mine = tasks.filter((t) => t.board === board);
  if (!mine.length) { $("board").innerHTML = `<div class="empty">No tasks on this board. Agents add them with create_task, or run: ainterlinked task add "Title"</div>`; return; }
  $("board").innerHTML = cols.map(([k, label]) => {
    const items = mine.filter((t) => (k === "blocked" ? t.status === "blocked" || t.status === "review" : t.status === k));
    return `<div class="col"><h3>${label}<span>${items.length}</span></h3>${items.slice(0, 40).map((t) => `<div class="task p${t.priority}">
      <div class="tid">#${t.id} · P${t.priority}${t.status === "review" ? " · review" : ""}${t.blocked_by_deps ? " · waiting deps" : ""}</div>
      <div>${esc(t.title)}</div>${t.assignee ? `<div class="who">@${esc(t.assignee)}</div>` : ""}</div>`).join("")}</div>`;
  }).join("");
}
const gb = (n) => { const g = n / 2 ** 30; return (g >= 100 ? g.toFixed(0) : g.toFixed(1)) + " GB"; };
// This machine's load: shown only while a session samples it (an old figure would mislead).
function loadSpans(m) {
  if (!m || !m.fresh) return `<span title="No session is sampling the load">load <b>–</b></span>`;
  const cpu = m.cpu < 0 ? "…" : (m.approx ? "~" : "") + Math.round(m.cpu) + "%";
  const avg = m.cpu_avg >= 0 && !m.approx ? ` title="1-minute average ${Math.round(m.cpu_avg)}%"` : "";
  return `<span${avg}>CPU <b>${cpu}</b> of ${m.cores} cores</span>` +
    `<span>memory <b>${gb(m.mem_avail)}</b> free of ${gb(m.mem_total)}</span>` +
    `<span>disk <b>${gb(m.disk_free)}</b> free of ${gb(m.disk_total)}</span>`;
}
function render(s) {
  const online = s.agents.filter((a) => a.online).length;
  $("meta").innerHTML = `<span>machine <b>${esc(s.machine)}</b></span>${loadSpans(s.load)}<span><b>${online}</b> agents online</span>` +
    `<span><b>${s.tasks.filter((t) => t.status !== "done" && t.status !== "cancelled").length}</b> open tasks</span><span><b>${s.locks.length}</b> reservations</span><span>v${esc(s.version)}</span>`;
  renderAgents(s.agents);
  renderHarnesses(s.harnesses || []);
  renderBoard(s.tasks, s.boards);
  $("locks").innerHTML = s.locks.length ? s.locks.map((l) => `<div class="sub"><span class="act">${esc(l.pattern)}</span> — ${esc(l.agent)}${l.reason ? " (" + esc(l.reason) + ")" : ""}</div>`).join("") : `<div class="empty">No files reserved.</div>`;
  $("msgs").innerHTML = s.messages.length ? s.messages.map((m) => `<div class="msg"><div class="h">#${m.id} <b>${esc(m.from)}</b> → ${esc(m.to)} · ${ago(m.created_at)} ago${m.urgent ? " · urgent" : ""}${m.subject ? " · " + esc(m.subject) : ""}</div><pre>${esc(m.body)}</pre></div>`).join("") : `<div class="empty">No messages yet.</div>`;
  $("feed").innerHTML = s.feed.length ? s.feed.slice().reverse().map((e) => `<div class="ev"><time>${hhmm(e.ts)}</time><span class="k">${esc(e.kind)}</span><span class="s">${esc(e.summary)}</span></div>`).join("") : `<div class="empty">No activity yet.</div>`;
}
async function tick() {
  try { render(await api("/api/state")); }
  catch (e) { $("meta").textContent = "Can't reach the hub: " + e.message; }
}
$("board-pick").addEventListener("change", (e) => { board = e.target.value; tick(); });
$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("send-err").textContent = "";
  try {
    await api("/api/send", { to: $("to").value.trim(), body: $("body").value });
    $("body").value = "";
    tick();
  } catch (err) { $("send-err").textContent = err.message; }
});
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
